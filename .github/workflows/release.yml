name: Release
on:
  push:
    tags: ["v*"]
  # manual release from the Actions tab (or API): creates the tag on the
  # dispatched commit and publishes the release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.3.0 (must match the crate version)"
        required: true

jobs:
  build:
    # musl build = fully static binaries that run on any Linux (glibc
    # builds from the 24.04 runner fail on older distros — verified live).
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: TARGETS="${{ matrix.target }}" bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: watchtower-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - run: cat dist/SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
