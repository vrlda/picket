name: Release
on:
  push:
    tags: ["v*"]
  # manual release from the Actions tab (or API): creates the tag on the
  # dispatched commit and publishes the release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.3.0 (must match the crate version)"
        required: true

jobs:
  build:
    # musl build = fully static binaries that run on any Linux (glibc
    # builds from the 24.04 runner fail on older distros — verified live).
    # macOS builds are mainly for watchtower-runner on a Mac.
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: TARGETS="${{ matrix.target }}" bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: watchtower-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # one checksum file for every target's tarball
      - run: cd dist && sha256sum watchtower-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
