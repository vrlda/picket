[package]
name = "picket-runner"
version = "0.6.2"
edition = "2021"
description = "Runs Picket agent tasks on an always-on machine (outbound HTTPS only)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["tls", "json"] }
glob = "0.3"

[dev-dependencies]
picket-server = { path = "../server" }
picket-common = { path = "../picket-common" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "any"] }
